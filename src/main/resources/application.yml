server:
  port: ${SERVER_PORT:8080}
  compression:
    # 禁用 HTTP 压缩（避免 Netty Zstd 版本兼容问题）
    enabled: false

spring:
  application:
    name: smart-trade-assistant
  ai:
    dashscope:
      # 禁用 Spring AI 的 DashScope 自动配置（使用自定义 AI 网关）
      enabled: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 10s
      # 连接池配置
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3s

# 日志配置
logging:
  level:
    com.trade: DEBUG
  ai:
    dashscope:
      # DashScope AI 日志开关
      enabled: ${DASHSCOPE_ENABLED}
  jackson:
    # JSON 序列化：不包含 null 字段
    default-property-inclusion: non_null
    serialization:
      # 日期格式化为 ISO-8601 字符串（而非时间戳）
      write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: true

# Actuator 监控配置
management:
  endpoints:
    web:
      exposure:
        # 暴露的监控端点：健康检查、信息、指标、Prometheus
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        # 启用健康检查探针（用于 K8s 等环境）
        enabled: true
      # 显示健康检查详情
      show-details: always
      show-components: always

# API 文档配置（SpringDoc API）
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Resilience4j 限流配置
resilience4j:
  ratelimiter:
    instances:
      # API 全局限流：每秒 100 次请求
      api:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 500ms
        # 是否启用限流
        registerHealthIndicator: true
        eventConsumerBufferSize: 100

      # 问答接口限流：每秒 20 次请求（防止恶意刷接口）
      chat:
        limitForPeriod: 20
        limitRefreshPeriod: 1s
        timeoutDuration: 200ms
        registerHealthIndicator: true
        eventConsumerBufferSize: 50

      # 文件上传限流：每分钟 10 次请求（防止资源耗尽）
      upload:
        limitForPeriod: 10
        limitRefreshPeriod: 1m
        timeoutDuration: 1s
        registerHealthIndicator: true
        eventConsumerBufferSize: 20

# AI 网关配置
ai:
  gateway:
    cache-ttl: 10m              # 缓存过期时间：10 分钟
    conversation-ttl: 2h        # 对话上下文过期时间：2 小时
    max-history-messages: 16    # 最大历史消息数

    # 安全认证配置
    security:
      enabled: ${AI_AUTH_ENABLED}
      tokens: ${AI_GATEWAY_TOKENS}
      # 敏感词过滤配置
      sensitive-word:
        enabled: true
      # Prompt 注入防护配置
      prompt-injection:
        enabled: true
      # XSS 防护配置
      xss:
        enabled: true
        # 是否拦截可疑请求（true 拦截，false 清洗）
        block-mode: false

    # 模型路由配置
    routing:
      default-model: DEEPSEEK              # 默认使用 DeepSeek 模型
      fallback-order: DEEPSEEK,ALIBABA_BAILIAN  # 降级顺序
      long-context-threshold: 4000          # 长文本阈值（超过则切换模型）

    # RAG 知识库配置
    rag:
      vector-store-type: milvus
      # 集合名称
      collection-name: trade_knowledge
      # 向量维度（需与 Embedding 模型输出维度一致，DashScope text-embedding-v4 默认 1024 维）
      dimension: 1024
      # 最大返回结果数
      max-results: 5
      # 相似度阈值
      similarity-threshold: 0.6
      # BM25 索引磁盘存储路径（FSDirectory，持久化存储，重启免重建）
      bm25-index-path: /app/data/bm25-index
      # 文本分块配置
      chunk-size: 200      # 每块字符数
      chunk-overlap: 35    # 块间重叠字符数   仅用来防语义截断，不要过大

      # Embedding 配置 —— 主模型 + 降级模型
      embedding:
        model: text-embedding-v4
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        path: /embeddings
        api-key: ${DASHSCOPE_API_KEY}
        encoding-format: float
        timeout: 30s
        max-retries: 2
        # 单价：0.05 元/百万 token（text-embedding-v4 官方价格）
        price-per-million-tokens: 0.05
        # 月度预算 元
        monthly-budget: 100.0

      fallback-embedding:
        model: text-embedding-v3
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        path: /embeddings
        api-key: ${DASHSCOPE_API_KEY}
        encoding-format: float
        timeout: 30s
        max-retries: 2
        price-per-million-tokens: 0.05

      # 健康检查配置 —— 定期检查 Embedding 服务可用性
      health-check:
        # 是否启用健康检查
        enabled: true
        # 健康检查间隔：60 秒
        interval-seconds: 60
        # 超时时间：5 秒
        timeout-seconds: 5
        # 连续失败多少次触发告警
        failure-threshold: 3

      # 成本监控配置 —— 跟踪 Embedding 调用的 token 消耗和成本
      cost-monitor:
        # 是否启用成本监控
        enabled: true
        # 月度预算：100 元
        monthly-budget: 100.0
        # 预算告警阈值：80%
        budget-alert-threshold: 80
        # 是否记录每次调用的详细日志（调试用）
        log-detailed-usage: true
      # Milvus 配置
      milvus:
        host: ${MILVUS_HOST}
        port: ${MILVUS_PORT}
        database: ${MILVUS_DATABASE}
        username: ${MILVUS_USERNAME}
        password: ${MILVUS_PASSWORD}
        timeout: 10s

      # 混合检索配置（向量 + BM25）
      hybrid:
        # 是否启用混合检索
        enabled: true
        # BM25 权重
        bm25-weight: 0.3
        # 向量检索权重
        vector-weight: 0.7
        # 融合后取 Top-K
        top-k: 10

      # Rerank 重排序配置
      rerank:
        # 是否启用 Rerank
        enabled: true
        # Rerank 模型
        model: qwen3-rerank
        # DashScope Rerank API 基础 URL
        base-url: https://dashscope.aliyuncs.com/api/v1
        # API 密钥
        api-key: ${DASHSCOPE_API_KEY}
        # 重排序后取 Top-K
        top-k: 5
        # DashScope Rerank API top_n 参数
        top-n: 5

    # 模型列表配置
    models:
      # DeepSeek 模型
      deepseek:
        provider: DEEPSEEK
        # 是否启用
        enabled: ${DEEPSEEK_ENABLED:true}
        # API 基础 URL
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
        # API 路径
        path: ${DEEPSEEK_CHAT_PATH:/chat/completions}
        # API 密钥
        api-key: ${DEEPSEEK_API_KEY}
        # 模型名称
        model: ${DEEPSEEK_MODEL:deepseek-chat}
        # 请求超时时间（RAG 问答需要更长时间）
        timeout: 120s
        # 最大输出 token 数
        max-tokens: 4096
        # 温度参数（值越低输出越确定）
        temperature: 0.3
        # 路由权重
        weight: 1.0
        # 模型能力：问答、推理、代码、分析
        capabilities: qa,reasoning,code,analysis

      # 阿里巴巴百炼模型
      bailian:
        provider: ALIBABA_BAILIAN
        enabled: ${BAILIAN_ENABLED:true}
        base-url: ${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        path: ${BAILIAN_CHAT_PATH:/chat/completions}
        api-key: ${BAILIAN_API_KEY}
        model: ${BAILIAN_MODEL:qwen-plus}
        timeout: 120s
        max-tokens: 4096
        temperature: 0.4
        weight: 1.0
        # 模型能力：问答、长文本、流程、规划、写作
        capabilities: qa,long_context,process,planning,writing

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: product-knowledge
