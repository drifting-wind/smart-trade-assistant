# 外贸智能助理

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: smart-trade-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://0.0.0.0:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - app-network  # 加入 app-network，可通过服务名互相访问
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  #MinIO - 对象存储（文件存储）
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: smart-trade-minio
    environment:
      # MinIO 认证信息
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      # Bind Mount：数据持久化到宿主机的 ./minio-data 目录
      - ./minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"  # S3 API 端口（应用内部调用）
      - "9001:9001"  # Web 控制台端口（浏览器访问）
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  #  Milvus - 向量数据库（向量存储与检索）
  milvus:
    image: milvusdb/milvus:v2.4.12
    container_name: smart-trade-milvus
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      # 启动顺序控制：等待 etcd 和 minio 都准备好
      etcd:
        condition: service_started  # etcd 启动即可（不要求健康）
      minio:
        condition: service_healthy  # minio 必须健康才启动
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s  # 首次启动等待 90s（Milvus 启动较慢）
      timeout: 20s
      retries: 3

  # Redis - 内存数据库（缓存 + 会话）
  redis:
    image: redis:7-alpine
    container_name: smart-trade-redis
    ports:
      - "6379:6379"
    volumes:
      # 命名卷持久化 RDB/AOF 数据
      - redis-data:/data
    # --appendonly yes：开启 AOF 持久化（每条写命令追加到日志）
    command: redis-server --appendonly yes
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 外贸智能助理 （Spring Boot 应用）
  app:
    # 基于当前目录的 Dockerfile 构建镜像
    build:
      context: .
      dockerfile: Dockerfile  # Dockerfile 路径
    container_name: smart-trade-app
    ports:
      - "8080:8080"
    # 环境变量：从 .env 文件一键加载（敏感信息放这里）
    env_file:
      - .env
    environment:
      # Spring 配置文件：激活 docker profile（覆盖 application.yml 中的默认配置）
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      - AI_GATEWAY_RAG_MILVUS_HOST=milvus
      - AI_GATEWAY_RAG_MILVUS_PORT=19530
      - AI_GATEWAY_RAG_MILVUS_DATABASE=trade
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - MINIO_ENDPOINT=http://minio:9000
      # JVM 参数：堆内存 512MB~1GB，使用 G1 垃圾回收器
      - JAVA_OPTS=-Xms1024m -Xmx1024m -XX:+UseG1GC
    volumes:
      - app-data:/app/data
      # BM25 索引及日志持久化（磁盘索引，重启免重建）
#      - bm25-index-data:/app/data/bm25-index
      - app-logs:/app/logs
    depends_on:
      # 启动顺序：Redis 和 Milvus 都健康后才启动应用
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - app-network
    # 重启策略：除非手动停止，否则自动重启（生产环境推荐）
    restart: unless-stopped


# 数据卷（Volumes）- 持久化存储
volumes:
  etcd-data:    # etcd 元数据
  milvus-data:  # Milvus 向量数据
  redis-data:   # Redis AOF/RDB 持久化数据
  app-data:     # 应用数据
#  bm25-index-data:  # BM25 磁盘索引（持久化，重启免重建）
  app-logs:     # 应用日志

# 网络（Networks）- 容器间通信
# 桥接网络：所有容器在同一二层网络，可通过服务名互访(例如：app 容器中访问 redis，直接用 hostname "redis" 即可解析)
networks:
  app-network:
    driver: bridge  # 桥接模式（单机开发环境，生产环境可考虑 overlay 模式（跨主机 Swarm 集群）
